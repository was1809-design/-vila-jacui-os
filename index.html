<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a376c"><title>Vila Jacuí OS</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(150deg,#062b58,#0b4b8c);min-height:100vh;display:grid;place-items:center;padding:20px;color:#10254b}.card{width:min(430px,100%);background:#fff;padding:28px;border-radius:28px;box-shadow:0 25px 60px #00152c55}.logo{width:64px;height:64px;border-radius:20px;background:#eaf2fb;display:grid;place-items:center;font-size:30px}h1{margin:18px 0 4px}p{color:#667085}input,button{width:100%;padding:15px;margin:7px 0;border-radius:13px;font-size:16px}input{border:1px solid #d5dce6}button{border:0;background:#0a376c;color:#fff;font-weight:750;cursor:pointer}.secondary{background:#edf3f9;color:#0a376c}.link{background:transparent;color:#0a376c;padding:10px}.msg{font-size:14px;padding-top:8px;line-height:1.4}.ok{color:#087a45}.err{color:#b42318}.hidden{display:none}</style></head><body><main class="card"><div class="logo">🏛️</div><h1>Vila Jacuí OS</h1><p id="subtitle">Crie sua conta para acessar o sistema.</p><input id="name" autocomplete="name" placeholder="Seu nome"><input id="email" type="email" autocomplete="email" value="was1809@gmail.com" placeholder="E-mail"><input id="pass" type="password" autocomplete="new-password" placeholder="Crie uma senha (mín. 6 caracteres)"><button id="primary" type="button">Criar minha conta</button><button id="toggle" class="secondary" type="button">Já tenho conta — entrar</button><button id="forgot" class="link hidden" type="button">Esqueci minha senha</button><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://fttvimhhxopvzxqrpsuk.supabase.co','sb_publishable_8o8-k50Z5ket4ShU-VN7JA_1C5Q6KCP');const $=id=>document.getElementById(id),m=$('msg'),nameEl=$('name'),emailEl=$('email'),passEl=$('pass'),primary=$('primary'),toggle=$('toggle'),forgot=$('forgot'),subtitle=$('subtitle');let mode='signup';function show(t,ok=false){m.textContent=t;m.className='msg '+(ok?'ok':'err')}function setBusy(v){primary.disabled=v;toggle.disabled=v;primary.textContent=v?'Aguarde...':(mode==='signup'?'Criar minha conta':'Entrar')}function render(){m.textContent='';if(mode==='signup'){subtitle.textContent='Crie sua conta para acessar o sistema.';nameEl.classList.remove('hidden');passEl.autocomplete='new-password';passEl.placeholder='Crie uma senha (mín. 6 caracteres)';primary.textContent='Criar minha conta';toggle.textContent='Já tenho conta — entrar';forgot.classList.add('hidden')}else{subtitle.textContent='Entre com seu e-mail e sua senha.';nameEl.classList.add('hidden');passEl.autocomplete='current-password';passEl.placeholder='Sua senha';primary.textContent='Entrar';toggle.textContent='Ainda não tenho conta — criar';forgot.classList.remove('hidden')}}toggle.onclick=()=>{mode=mode==='signup'?'login':'signup';render()};primary.onclick=async()=>{const email=emailEl.value.trim(),password=passEl.value;if(!email)return show('Digite seu e-mail.');if(password.length<6)return show('A senha precisa ter pelo menos 6 caracteres.');setBusy(true);try{if(mode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:nameEl.value.trim()||'Wellington'},emailRedirectTo:location.origin+location.pathname}});if(error)return show(error.message);if(data.session)return show('Conta criada e acesso liberado.',true);show('Cadastro recebido. Abra o e-mail de confirmação que enviamos para '+email+'. Depois volte aqui e toque em “Já tenho conta — entrar”.',true)}else{const {error}=await sb.auth.signInWithPassword({email,password});show(error?'E-mail ou senha incorretos. Se você já criou a conta, use “Esqueci minha senha”.':'Login realizado com sucesso.',!error)}}catch(e){show('Não foi possível conectar agora. Tente novamente.')}finally{setBusy(false)}};forgot.onclick=async()=>{const email=emailEl.value.trim();if(!email)return show('Digite seu e-mail primeiro.');forgot.disabled=true;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});show(error?error.message:'Enviei um link de recuperação para '+email+'.',!error);forgot.disabled=false};render();</script></body></html>
