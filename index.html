<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a376c"><title>Vila Jacuí OS</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(150deg,#062b58,#0b4b8c);min-height:100vh;display:grid;place-items:center;padding:20px;color:#10254b}.card{width:min(430px,100%);background:#fff;padding:28px;border-radius:28px;box-shadow:0 25px 60px #00152c55}.logo{width:64px;height:64px;border-radius:20px;background:#eaf2fb;display:grid;place-items:center;font-size:30px}h1{margin:18px 0 4px}p{color:#667085}input,button{width:100%;padding:15px;margin:7px 0;border-radius:13px;font-size:16px}input{border:1px solid #d5dce6}button{border:0;background:#0a376c;color:#fff;font-weight:750}.secondary{background:#edf3f9;color:#0a376c}.msg{font-size:14px;padding-top:8px}.ok{color:#087a45}.err{color:#b42318}</style></head><body><main class="card"><div class="logo">🏛️</div><h1>Vila Jacuí OS</h1><p>Crie sua conta para acessar o sistema.</p><input id="name" autocomplete="name" placeholder="Seu nome"><input id="email" type="email" autocomplete="email" value="was1809@gmail.com" placeholder="E-mail"><input id="pass" type="password" autocomplete="new-password" placeholder="Crie uma senha (mín. 6 caracteres)"><button onclick="signup()">Criar minha conta</button><button class="secondary" onclick="login()">Já tenho conta — entrar</button><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://fttvimhhxopvzxqrpsuk.supabase.co','sb_publishable_8o8-k50Z5ket4ShU-VN7JA_1C5Q6KCP'),m=document.getElementById('msg');function show(t,ok){m.textContent=t;m.className='msg '+(ok?'ok':'err')}async function signup(){if(pass.value.length<6)return show('A senha precisa ter pelo menos 6 caracteres.');let{error}=await sb.auth.signUp({email:email.value.trim(),password:pass.value,options:{data:{display_name:name.value.trim()||'Wellington'}}});show(error?error.message:'Conta criada. Confira seu e-mail para confirmar o cadastro.',!error)}async function login(){let{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});show(error?error.message:'Login realizado com sucesso.',!error)}</script></body></html>
